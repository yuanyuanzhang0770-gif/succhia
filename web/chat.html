<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Succhia AI Chat</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#12101f;color:#f3edff}body{display:flex;flex-direction:column}.top{padding:calc(env(safe-area-inset-top) + 13px) 16px 12px;border-bottom:1px solid #39304d;display:flex;align-items:center;justify-content:space-between}.top strong{font-size:17px}.top small{display:block;color:#aaa1be;font-size:11px;margin-top:3px}button{cursor:pointer;font:inherit}.settings{background:#29213c;color:#eee;border:1px solid #594875;border-radius:12px;padding:9px 12px}.messages{flex:1;min-height:0;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:12px}.message{max-width:88%;padding:12px 14px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:15px}.ai{align-self:flex-start;background:#29233b;border-bottom-left-radius:5px}.me{align-self:flex-end;background:#7548ba;border-bottom-right-radius:5px}.notice{color:#bfb0d2;text-align:center;font-size:12px}.composer{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #39304d}textarea{flex:1;resize:none;height:46px;max-height:120px;border-radius:14px;background:#28223c;border:1px solid #55476f;color:white;padding:12px;font:inherit}.send{background:#995ce4;border:0;border-radius:13px;color:white;font-weight:600;padding:0 17px}.send:disabled{opacity:.45}dialog{background:#221a32;color:white;border:1px solid #6e508e;border-radius:18px;width:min(92vw,420px);padding:20px}dialog::backdrop{background:#000b}dialog label{display:block;font-size:13px;margin-top:14px}dialog input{display:block;width:100%;font:inherit;background:#110d19;color:white;border:1px solid #665778;border-radius:8px;padding:10px;margin-top:6px}dialog .actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}dialog button{border:0;border-radius:9px;padding:10px;background:#a369e9;color:#fff}.muted{color:#b7abc8;font-size:12px;line-height:1.5}</style></head><body>
<header class="top"><div><strong>✦ Succhia AI</strong><small>聊天模式 · 设备操作需单独授权</small></div><div style="display:flex;gap:7px"><button class="settings" id="toggle">控制</button><button class="settings" id="setup">设置</button></div></header>
<main id="messages" class="messages" aria-live="polite"><div class="message ai">你好！我是你的 AI 聊天助手。先点击右上角「设置」，填入 Cloudflare Worker 地址和你的访问密码。</div></main>
<form id="form" class="composer"><textarea id="input" placeholder="输入消息…" aria-label="消息" required></textarea><button class="send" id="send">发送</button></form>
<dialog id="dialog"><h3>连接 AI</h3><p class="muted">Worker 地址应以 https:// 开头。访问密码只在本次浏览器会话保存，不要填写 OpenAI API Key。</p><label>Cloudflare Worker 地址<input id="url" placeholder="https://your-worker.example.workers.dev" autocomplete="url"></label><label>访问密码<input id="password" type="password" placeholder="你给 Worker 设置的密码" autocomplete="off"></label><div class="actions"><button type="button" id="cancel">取消</button><button type="button" id="save">保存</button></div></dialog>
<script>
const $=id=>document.getElementById(id), messages=$('messages');let history=[];let worker=sessionStorage.getItem('succhia_worker')||'',password=sessionStorage.getItem('succhia_password')||'';
function bubble(text,kind){let div=document.createElement('div');div.className='message '+kind;div.textContent=text;messages.append(div);messages.scrollTop=messages.scrollHeight;return div}
function openSettings(){$('url').value=worker;$('password').value=password;$('dialog').showModal()}
$('toggle').onclick=()=>parent.postMessage('succhia:toggle',location.origin);$('setup').onclick=openSettings;$('cancel').onclick=()=>$('dialog').close();$('save').onclick=()=>{let val=$('url').value.trim().replace(/\/+$/,'');if(!/^https:\/\//.test(val)){alert('请输入 HTTPS Worker 地址');return}worker=val;password=$('password').value;sessionStorage.setItem('succhia_worker',worker);sessionStorage.setItem('succhia_password',password);$('dialog').close()};
$('form').onsubmit=async e=>{e.preventDefault();let value=$('input').value.trim();if(!value)return;if(!worker||!password){openSettings();return}bubble(value,'me');$('input').value='';history.push({role:'user',content:value});let pending=bubble('正在思考…','ai');$('send').disabled=true;try{let r=await fetch(worker+'/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+password},body:JSON.stringify({messages:history.slice(-16)})});let data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);if(typeof data.reply!=='string')throw Error('AI 响应格式错误');pending.textContent=data.reply;history.push({role:'assistant',content:data.reply})}catch(err){pending.textContent='连接失败：'+err.message+'。检查 Worker 地址、访问密码和 API 额度。';history.pop()}finally{$('send').disabled=false;messages.scrollTop=messages.scrollHeight}};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});
if(!worker)openSettings();
</script></body></html>
